name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  frontend:
    name: Frontend build, tests, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Translations are complete in every language
        working-directory: frontend
        run: npm run i18n:check

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  vulnerabilities:
    name: Dependencies carry no known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
